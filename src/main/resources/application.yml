server:
  port: 8080
spring:
  application:
    name: mugsun-boot
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/mugsun
    username: mugsun
    password: mugsun
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
management:
  endpoints:
    web:
      exposure:
        include: health,info
sa-token:
  token-name: Authorization
  timeout: 2592000
  token-style: uuid
  is-log: false
mybatis-flex:
  global-config:
    print-banner: false
    tenant-column: tenant_id
jetcache:
  statIntervalMinutes: 1
  areaInCacheName: false
  local:
    default:
      type: linkedhashmap
      keyConvertor: jackson
      limit: 500
      expireAfterWriteInMillis: 3600000
dromara:
  x-file-storage:
    default-platform: local-plus-1
    local-plus:
      - platform: local-plus-1
        enable-storage: true
        enable-access: true
        domain: http://127.0.0.1:8080/file/
        base-path: mugsun/
        path-patterns: /file/**
        storage-path: /tmp/mugsun-files/
sms:
  config-type: yaml
  blends:
    default:
      supplier: alibaba
      access-key-id: placeholder
      access-key-secret: placeholder
      signature: mugsun
      template-id: SMS_000000
powerjob:
  worker:
    enabled: true
    app-name: mugsun
    server-address: 127.0.0.1:7700
    protocol: http
    store-strategy: disk
    port: 27777
liteflow:
  rule-source: flow/*.el.xml
