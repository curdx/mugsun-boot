server:
  port: 8080
spring:
  application:
    name: mugsun-boot
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/mugsun
    username: mugsun
    password: mugsun
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
management:
  endpoints:
    web:
      exposure:
        include: health,info
sa-token:
  token-name: satoken
  timeout: 2592000
  token-style: uuid
  is-log: false
mybatis-flex:
  global-config:
    print-banner: false
    tenant-column: tenant_id
jetcache:
  statIntervalMinutes: 0
  areaInCacheName: false
  local:
    default:
      type: linkedhashmap
      keyConvertor: jackson
      limit: 500
      expireAfterWriteInMillis: 3600000
