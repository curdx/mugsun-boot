server:
  port: 8080
spring:
  application:
    name: mugsun-boot
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    placeholder-replacement: false
  data:
    redis:
      host: localhost
      port: 6379
      database: 3
      timeout: 3000ms
  mail:
    host: smtp.example.com
    port: 465
    username: placeholder@example.com
    password: placeholder
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
management:
  # 邮件为尽力而为通道：默认关闭 mail 健康指标，避免占位/未配真实 SMTP 时 /actuator/health 聚合恒 503（配真实 SMTP 后可开启）
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        # prometheus/metrics 由 ActuatorAuthFilter 门控（登录 + sys:monitor:list）；health/info 保持公开
        include: health,info,metrics,prometheus
  # Boot 3.5 起 management.defaults.metrics.export.enabled 默认视为 false，Prometheus 注册表须显式开启
  prometheus:
    metrics:
      export:
        enabled: true
# 日志行级别段注入 traceId（TraceIdFilter 写入 MDC；选 yml 而非 logback.xml：项目无 logback 配置先例，yml 为配置约定）
logging:
  pattern:
    level: "%5p [%X{traceId}]"
sa-token:
  token-name: Authorization
  timeout: 2592000
  token-style: uuid
  is-log: false
  # 并发登录控制：允许同账号多端在线（is-concurrent），各端独立 token（is-share=false，方可按 token 踢单端），单账号最大并发终端数
  is-concurrent: true
  is-share: false
  max-login-count: 12
mybatis-flex:
  datasource:
    primary:
      type: hikari
      url: jdbc:postgresql://localhost:5432/mugsun
      username: mugsun
      password: mugsun
  default-datasource-key: primary
  global-config:
    print-banner: false
    tenant-column: tenant_id
jetcache:
  statIntervalMinutes: 1
  areaInCacheName: false
  local:
    default:
      type: linkedhashmap
      keyConvertor: bean:tenantKeyConvertor
      limit: 500
      expireAfterWriteInMillis: 3600000
  remote:
    default:
      type: redis.lettuce
      keyConvertor: bean:tenantKeyConvertor
      valueEncoder: java
      valueDecoder: java
      uri: redis://localhost:6379/3
dromara:
  x-file-storage:
    default-platform: local-plus-1
    local-plus:
      - platform: local-plus-1
        enable-storage: true
        enable-access: true
        domain: http://127.0.0.1:8080/file/
        base-path: mugsun/
        path-patterns: /file/**
        storage-path: /tmp/mugsun-files/
sms:
  config-type: yaml
  blends:
    default:
      supplier: alibaba
      access-key-id: placeholder
      access-key-secret: placeholder
      signature: mugsun
      template-id: SMS_000000
powerjob:
  worker:
    enabled: true
    app-name: mugsun
    server-address: 127.0.0.1:7700
    protocol: http
    store-strategy: disk
    port: 27777
liteflow:
  rule-source: flow/*.el.xml
mugsun:
  captcha:
    enabled: true
    show-code: true
    expire-seconds: 300
  sms:
    show-code: true          # 开发回显短信验证码（生产须 false）
  crypto:
    gm-enabled: ${MUGSUN_GM_ENABLED:true}          # 国密总开关（传输 SM2 / 摘要 SM3 一处切）
    sm4-key: ${MUGSUN_SM4_KEY:mugsun-sm4-key16}     # SM4 字段加密密钥（生产经环境变量注入）
    api-key: ${MUGSUN_API_KEY:mugsun-api-key16}
    sm2-private-key: ${MUGSUN_SM2_PRIVATE_KEY:}     # SM2 传输私钥 hex（留空则启动生成并告警）
    sm2-public-key: ${MUGSUN_SM2_PUBLIC_KEY:}       # SM2 传输公钥 hex（04+128）
  serial-number:
    provider: redis          # redis 自增（默认）/ db 行锁
  websocket:
    sender-type: redis       # 推送扇出：local=单机直发（仅本地调试）/ redis=集群经 Redis Pub/Sub 扇出
  social:
    enabled: true
    # 本地 mock 授权页（后端端点，dev 联调）
    mock-authorize-url: http://localhost:8080/auth/social/mock-authorize
    type:
      # 本地 mock 来源：无真实凭证即可端到端验证社交登录全链路（含 hash 路由回调，须引号避免 # 被当注释）
      mock:
        client-id: mock-client
        client-secret: mock-secret
        redirect-uri: "http://localhost:3006/#/auth/social-callback?source=mock"
