server:
  port: 8080
spring:
  application:
    name: mugsun-boot
  threads:
    virtual:
      enabled: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    placeholder-replacement: false
  data:
    redis:
      host: localhost
      port: 6379
      database: 3
      timeout: 3000ms
  mail:
    host: smtp.example.com
    port: 465
    username: placeholder@example.com
    password: placeholder
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
management:
  endpoints:
    web:
      exposure:
        include: health,info
sa-token:
  token-name: Authorization
  timeout: 2592000
  token-style: uuid
  is-log: false
  # 并发登录控制：允许同账号多端在线（is-concurrent），各端独立 token（is-share=false，方可按 token 踢单端），单账号最大并发终端数
  is-concurrent: true
  is-share: false
  max-login-count: 12
mybatis-flex:
  datasource:
    primary:
      type: hikari
      url: jdbc:postgresql://localhost:5432/mugsun
      username: mugsun
      password: mugsun
  default-datasource-key: primary
  global-config:
    print-banner: false
    tenant-column: tenant_id
jetcache:
  statIntervalMinutes: 1
  areaInCacheName: false
  local:
    default:
      type: linkedhashmap
      keyConvertor: bean:tenantKeyConvertor
      limit: 500
      expireAfterWriteInMillis: 3600000
  remote:
    default:
      type: redis.lettuce
      keyConvertor: bean:tenantKeyConvertor
      valueEncoder: java
      valueDecoder: java
      uri: redis://localhost:6379/3
dromara:
  x-file-storage:
    default-platform: local-plus-1
    local-plus:
      - platform: local-plus-1
        enable-storage: true
        enable-access: true
        domain: http://127.0.0.1:8080/file/
        base-path: mugsun/
        path-patterns: /file/**
        storage-path: /tmp/mugsun-files/
sms:
  config-type: yaml
  blends:
    default:
      supplier: alibaba
      access-key-id: placeholder
      access-key-secret: placeholder
      signature: mugsun
      template-id: SMS_000000
powerjob:
  worker:
    enabled: true
    app-name: mugsun
    server-address: 127.0.0.1:7700
    protocol: http
    store-strategy: disk
    port: 27777
liteflow:
  rule-source: flow/*.el.xml
mugsun:
  captcha:
    enabled: true
    show-code: true
    expire-seconds: 300
  sms:
    show-code: true          # 开发回显短信验证码（生产须 false）
  crypto:
    sm4-key: mugsun-sm4-key16
    api-key: mugsun-api-key16
  serial-number:
    provider: redis          # redis 自增（默认）/ db 行锁
  social:
    enabled: true
    # 本地 mock 授权页（后端端点，dev 联调）
    mock-authorize-url: http://localhost:8080/auth/social/mock-authorize
    type:
      # 本地 mock 来源：无真实凭证即可端到端验证社交登录全链路（含 hash 路由回调，须引号避免 # 被当注释）
      mock:
        client-id: mock-client
        client-secret: mock-secret
        redirect-uri: "http://localhost:3006/#/auth/social-callback?source=mock"
